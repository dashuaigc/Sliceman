<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img" aria-labelledby="title desc">
<title id="title">图标超出定位格时，输出范围会自动变大</title><desc id="desc">找出四个方向中最大的超出量，再向四周扩展同样的距离；输出中心仍是定位格中心。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="612" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">图标超出定位格时，输出范围会自动变大</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">找出四个方向中最大的超出量，再向四周扩展同样的距离；输出中心仍是定位格中心。</text><rect x="40" y="125" width="350" height="402" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">① 图标超出定位格</text><rect x="75" y="205" width="240" height="240" rx="0" fill="#f7f9fc" stroke="none" /><path d="M220 298 H285 L315 325 L285 352 H220Z" fill="#de9832"/><circle cx="195" cy="325" r="65" fill="#f2b544"/><text x="195" y="341" font-size="46" fill="#fff7dd" font-weight="700" text-anchor="middle">S</text><rect x="95" y="225" width="200" height="200" rx="0" fill="none" stroke="#18a999" stroke-width="3" stroke-dasharray="8 5"/><path d="M295 205 L295 225" fill="none" stroke="#df6675" stroke-width="2" /><path d="M315 205 L315 310" fill="none" stroke="#df6675" stroke-width="2" stroke-dasharray="7 5"/><text x="215" y="197" font-size="19" fill="#c14c61" font-weight="600" text-anchor="start">右侧超出 20 px</text><text x="215" y="477" font-size="23" fill="#18a999" font-weight="650" text-anchor="middle">定位格 200 × 200</text><text x="215" y="508" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle">绿色虚线是定位格边界</text><rect x="425" y="125" width="350" height="402" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="449" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">② 四周各扩展 20 px</text><rect x="460" y="205" width="240" height="240" rx="0" fill="url(#checker)" stroke="none" /><path d="M605 298 H670 L700 325 L670 352 H605Z" fill="#de9832"/><circle cx="580" cy="325" r="65" fill="#f2b544"/><text x="580" y="341" font-size="46" fill="#fff7dd" font-weight="700" text-anchor="middle">S</text><rect x="480" y="225" width="200" height="200" rx="0" fill="none" stroke="#18a999" stroke-width="3" stroke-dasharray="8 5"/><rect x="460" y="205" width="240" height="240" rx="0" fill="none" stroke="#4479ed" stroke-width="3"/><path d="M568 325 L592 325" fill="none" stroke="#172b4d" stroke-width="2" /><path d="M580 313 L580 337" fill="none" stroke="#172b4d" stroke-width="2" /><text x="600" y="197" font-size="18" fill="#4479ed" font-weight="600" text-anchor="middle">蓝框 = 新的输出范围</text><text x="600" y="477" font-size="23" fill="#4479ed" font-weight="650" text-anchor="middle">输出 240 × 240</text><text x="600" y="508" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle">上下左右都增加同样的距离</text><rect x="810" y="125" width="350" height="402" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="834" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">③ 完整导出，保留中心</text><rect x="845" y="205" width="240" height="240" rx="0" fill="url(#checker)" stroke="none" /><path d="M990 298 H1055 L1085 325 L1055 352 H990Z" fill="#de9832"/><circle cx="965" cy="325" r="65" fill="#f2b544"/><text x="965" y="341" font-size="46" fill="#fff7dd" font-weight="700" text-anchor="middle">S</text><rect x="845" y="205" width="240" height="240" rx="0" fill="none" stroke="#4479ed" stroke-width="3"/><text x="985" y="477" font-size="23" fill="#4479ed" font-weight="650" text-anchor="middle">输出 240 × 240</text><text x="985" y="508" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle">不裁图标，定位格不出图</text><text x="40" y="574" font-size="23" fill="#172b4d" font-weight="600" text-anchor="start">计算方式：200 + 20 × 2 = 240 px。示例按 1× 导出，图标本身不缩放、不移动。</text></g></svg>