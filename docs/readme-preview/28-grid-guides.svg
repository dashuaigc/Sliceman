<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">自动创建参考线：边缘好对齐，中心好定位</title><desc id="desc">图中以一个定位格放大说明；实际会为每格计算参考线，参考线贯穿画布，不是画在图层上的线。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="610" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">自动创建参考线：边缘好对齐，中心好定位</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">图中以一个定位格放大说明；实际会为每格计算参考线，参考线贯穿画布，不是画在图层上的线。</text><rect x="40" y="125" width="550" height="355" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">关闭：只创建定位格</text><rect x="610" y="125" width="550" height="355" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="634" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">开启：同时创建边缘线与中心线</text><rect x="110" y="205" width="350" height="210" rx="0" fill="#f5f8fc" stroke="#b9c7da" /><rect x="185" y="250" width="200" height="120" rx="0" fill="#dce8ff" stroke="#4479ed" /><text x="315" y="452" font-size="21" fill="#172b4d" font-weight="600" text-anchor="middle">一个矩形形状层，没有新增参考线</text><rect x="680" y="205" width="350" height="210" rx="0" fill="#f5f8fc" stroke="#b9c7da" /><rect x="755" y="250" width="200" height="120" rx="0" fill="#dce8ff" stroke="#4479ed" /><path d="M755 215 L755 405" fill="none" stroke="#18a999" stroke-width="2" /><path d="M855 215 L855 405" fill="none" stroke="#18a999" stroke-width="2" /><path d="M955 215 L955 405" fill="none" stroke="#18a999" stroke-width="2" /><path d="M690 250 L1020 250" fill="none" stroke="#18a999" stroke-width="2" /><path d="M690 310 L1020 310" fill="none" stroke="#18a999" stroke-width="2" /><path d="M690 370 L1020 370" fill="none" stroke="#18a999" stroke-width="2" /><text x="885" y="452" font-size="21" fill="#172b4d" font-weight="600" text-anchor="middle">每格：3 条竖线 + 3 条横线</text><text x="40" y="528" font-size="23" fill="#18a999" font-weight="600" text-anchor="start">左边缘 / 垂直中心 / 右边缘　＋　上边缘 / 水平中心 / 下边缘</text><text x="40" y="569" font-size="22" fill="#64748b" font-weight="400" text-anchor="start">相同位置的参考线会合并去重；关闭开关不会删除文档里已经存在的参考线。</text></g></svg>