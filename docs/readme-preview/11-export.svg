<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">用图层颜色告诉插件：哪些要导出</title><desc id="desc">无标记：按层导出。红色：跳过。蓝色组：合并导出。红色优先于蓝色。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="470" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">用图层颜色告诉插件：哪些要导出</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">无标记：按层导出。红色：跳过。蓝色组：合并导出。红色优先于蓝色。</text><rect x="40" y="122" width="530" height="310" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">Photoshop 图层</text><rect x="680" y="122" width="480" height="310" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="704" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">导出的图片文件</text><path d="M593 280 L650 280" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="66" y="177" width="80" height="38" rx="6" fill="#edf3ff" stroke="none" /><text x="106" y="203" font-size="19" fill="#4479ed" font-weight="600" text-anchor="middle">默认</text><text x="165" y="206" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">Icon_Coin</text><text x="710" y="206" font-size="24" fill="#4479ed" font-weight="600" text-anchor="start">Icon_Coin.png</text><rect x="66" y="257" width="80" height="38" rx="6" fill="#fbe9ed" stroke="none" /><text x="106" y="283" font-size="19" fill="#df6675" font-weight="600" text-anchor="middle">红色</text><text x="165" y="286" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">辅助标注</text><text x="710" y="286" font-size="24" fill="#64748b" font-weight="600" text-anchor="start">不导出</text><rect x="66" y="337" width="80" height="38" rx="6" fill="#edf3ff" stroke="none" /><text x="106" y="363" font-size="19" fill="#4479ed" font-weight="600" text-anchor="middle">蓝色组</text><text x="165" y="366" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">Button_Play</text><text x="710" y="366" font-size="24" fill="#4479ed" font-weight="600" text-anchor="start">Button_Play.png</text><text x="165" y="393" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">组内图层一起合成</text></g></svg>