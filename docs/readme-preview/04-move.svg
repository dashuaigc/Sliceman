<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-labelledby="title desc">
<title id="title">向右 100 px，是移动距离，不是坐标</title><desc id="desc">先选方向，再填距离。斜向移动时，分别填写水平和垂直距离。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="452" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">向右 100 px，是移动距离，不是坐标</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">先选方向，再填距离。斜向移动时，分别填写水平和垂直距离。</text><rect x="40" y="122" width="530" height="290" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">整体平移</text><rect x="600" y="122" width="560" height="290" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="624" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">复制移动</text><rect x="66" y="195" width="466" height="148" rx="14" fill="#f7f9fd" stroke="none" /><rect x="98" y="224" width="45" height="45" rx="6" fill="none" stroke="#a9b7cc" stroke-dasharray="5 4"/><rect x="330" y="224" width="45" height="45" rx="6" fill="#4479ed" stroke="none" /><rect x="162" y="249" width="45" height="45" rx="6" fill="none" stroke="#a9b7cc" stroke-dasharray="5 4"/><rect x="394" y="249" width="45" height="45" rx="6" fill="#18a999" stroke="none" /><path d="M211 265 L281 265" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><text x="236" y="208" font-size="19" fill="#4479ed" font-weight="600" text-anchor="middle">→ 100 px</text><rect x="626" y="195" width="466" height="148" rx="14" fill="#f7f9fd" stroke="none" /><rect x="658" y="224" width="45" height="45" rx="6" fill="none" stroke="#a9b7cc" stroke-dasharray="5 4"/><rect x="890" y="224" width="45" height="45" rx="6" fill="#4479ed" stroke="none" /><rect x="658" y="224" width="45" height="45" rx="6" fill="#a5c1fb" stroke="none" /><rect x="722" y="249" width="45" height="45" rx="6" fill="none" stroke="#a9b7cc" stroke-dasharray="5 4"/><rect x="954" y="249" width="45" height="45" rx="6" fill="#18a999" stroke="none" /><rect x="722" y="249" width="45" height="45" rx="6" fill="#8bd2c8" stroke="none" /><path d="M771 265 L841 265" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><text x="796" y="208" font-size="19" fill="#4479ed" font-weight="600" text-anchor="middle">→ 100 px</text><text x="66" y="382" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">原位置变空，对象间的关系不变</text><text x="626" y="382" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">原对象保留，副本向右移动</text></g></svg>