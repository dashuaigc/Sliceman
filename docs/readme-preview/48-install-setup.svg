<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><title>一键安装版 · 解压后运行 EXE</title><rect width="1200" height="420" rx="22" fill="#f3f7fc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="32" y="49" font-size="30" font-weight="700" fill="#172b4d">一键安装版 · 解压后运行 EXE</text><text x="32" y="86" font-size="19" fill="#64748b">仅适用于 Windows；不需要 Creative Cloud 或 UXP Developer Tool。</text><rect x="32" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="62" cy="150" r="15" fill="#4479ed"/><text x="62" y="157" text-anchor="middle" font-size="19" fill="white">1</text><text x="86" y="157" font-size="23" font-weight="700" fill="#172b4d">完整解压</text><rect x="52" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="164" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">Setup ZIP</text><text x="52" y="289" font-size="20" fill="#53647f">下载 Sliceman_Setup ZIP</text><text x="52" y="320" font-size="20" fill="#53647f">右键 → 全部解压缩</text><text x="309" y="227" text-anchor="middle" font-size="26" fill="#4479ed">→</text><rect x="326" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="356" cy="150" r="15" fill="#4479ed"/><text x="356" y="157" text-anchor="middle" font-size="19" fill="white">2</text><text x="380" y="157" font-size="23" font-weight="700" fill="#172b4d">启动安装器</text><rect x="346" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="458" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">一键安装.exe</text><text x="346" y="289" font-size="20" fill="#53647f">打开解压后的文件夹</text><text x="346" y="320" font-size="20" fill="#53647f">双击蓝色 S 图标</text><text x="603" y="227" text-anchor="middle" font-size="26" fill="#4479ed">→</text><rect x="620" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="650" cy="150" r="15" fill="#4479ed"/><text x="650" y="157" text-anchor="middle" font-size="19" fill="white">3</text><text x="674" y="157" font-size="23" font-weight="700" fill="#172b4d">等待 PS 退出</text><rect x="640" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="752" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">保存 → 退出 PS</text><text x="640" y="289" font-size="20" fill="#53647f">PS 正在运行：先保存退出</text><text x="640" y="320" font-size="20" fill="#53647f">未运行：自动开始安装</text><text x="897" y="227" text-anchor="middle" font-size="26" fill="#4479ed">→</text><rect x="914" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="944" cy="150" r="15" fill="#4479ed"/><text x="944" y="157" text-anchor="middle" font-size="19" fill="white">4</text><text x="968" y="157" font-size="23" font-weight="700" fill="#172b4d">完成后打开</text><rect x="934" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="1046" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">安装完成</text><text x="934" y="289" font-size="20" fill="#53647f">重启 Photoshop</text><text x="934" y="320" font-size="20" fill="#53647f">增效工具 → Sliceman</text></g></svg>