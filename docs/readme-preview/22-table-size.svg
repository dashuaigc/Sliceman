<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">尺寸方式：宽和高，究竟是在描述谁？</title><desc id="desc">同样以 3 行 4 列举例；图中采用单一形状，行距、列距均为 0，圆角为 0。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="520" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">尺寸方式：宽和高，究竟是在描述谁？</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">同样以 3 行 4 列举例；图中采用单一形状，行距、列距均为 0，圆角为 0。</text><rect x="40" y="125" width="550" height="355" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">单元格尺寸：先确定一格多大</text><text x="65" y="204" font-size="23" fill="#4479ed" font-weight="650" text-anchor="start">输入宽 120、高 60</text><rect x="110" y="245" width="90" height="45" rx="0" fill="#dce9ff" stroke="none" /><rect x="110" y="245" width="360" height="135" rx="0" fill="none" stroke="#4479ed" stroke-width="3"/><path d="M110 290.0 L470 290.0" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M110 335.0 L470 335.0" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M200.0 245 L200.0 380" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M290.0 245 L290.0 380" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M380.0 245 L380.0 380" fill="none" stroke="#4479ed" stroke-width="2" /><text x="290" y="230" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">整张宽 480 px</text><text x="155" y="274" font-size="18" fill="#4479ed" font-weight="600" text-anchor="middle">一格</text><text x="65" y="421" font-size="22" fill="#172b4d" font-weight="600" text-anchor="start">每格 120 × 60 → 整张 480 × 180</text><text x="65" y="457" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">格子尺寸固定，行列越多，表格越大</text><rect x="610" y="125" width="550" height="355" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="634" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">表格总尺寸：先确定整张多大</text><text x="635" y="204" font-size="23" fill="#4479ed" font-weight="650" text-anchor="start">输入宽 480、高 180</text><rect x="680" y="245" width="360" height="135" rx="0" fill="none" stroke="#4479ed" stroke-width="3"/><path d="M680 290.0 L1040 290.0" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M680 335.0 L1040 335.0" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M770.0 245 L770.0 380" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M860.0 245 L860.0 380" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M950.0 245 L950.0 380" fill="none" stroke="#4479ed" stroke-width="2" /><text x="860" y="230" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">整张宽 480 px</text><text x="635" y="421" font-size="22" fill="#172b4d" font-weight="600" text-anchor="start">整张 480 × 180 → 每格 120 × 60</text><text x="635" y="457" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">总尺寸固定，行列越多，格子越小</text></g></svg>