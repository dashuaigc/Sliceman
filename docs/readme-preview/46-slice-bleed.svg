<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="485" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc">
<title id="title">完整导出超出画布部分：保留还是裁掉？</title><desc id="desc">默认开启。仅说明完整切图；Symbols 由定位格及图标边界决定输出范围。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="485" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">完整导出超出画布部分：保留还是裁掉？</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">默认开启。仅说明完整切图；Symbols 由定位格及图标边界决定输出范围。</text><rect x="40" y="125" width="350" height="320" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">源文件：图案超出画布右边</text><rect x="90" y="210" width="170" height="150" rx="0" fill="#eef3fb" stroke="#4479ed" /><circle cx="250" cy="285" r="65" fill="#f2b544"/><path d="M260 195 L260 375" fill="none" stroke="#d8586d" stroke-width="2" stroke-dasharray="7 5"/><text x="215" y="408" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle">蓝框是原画布，虚线是裁切边界</text><rect x="425" y="125" width="350" height="320" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="449" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">关闭：超出部分被裁掉</text><svg x="515" y="220" width="75" height="130" viewBox="0 0 75 130"><circle cx="65" cy="65" r="65" fill="#f2b544"/></svg><text x="600" y="408" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle">只导出原画布内的图案</text><rect x="810" y="125" width="350" height="320" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="834" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">开启：保留完整图案</text><circle cx="985" cy="285" r="65" fill="#f2b544"/><text x="985" y="408" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle">画布外的像素也一起导出</text></g></svg>