<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="442" viewBox="0 0 1200 442" role="img" aria-labelledby="title desc">
<title id="title">批处理的关键：每个对象各做一次</title><desc id="desc">选中组和它的子层时，以最外层的选中项为单位处理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="442" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">批处理的关键：每个对象各做一次</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">选中组和它的子层时，以最外层的选中项为单位处理。</text><rect x="40" y="122" width="350" height="284" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">选中三个对象</text><rect x="430" y="122" width="350" height="284" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="454" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">分别转为智能对象</text><rect x="820" y="122" width="340" height="284" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="844" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">新建独立的组</text><rect x="65" y="179" width="300" height="42" rx="14" fill="#f1f5fb" stroke="none" /><text x="86" y="204" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">图层 A</text><rect x="455" y="179" width="300" height="42" rx="14" fill="#edf3ff" stroke="none" /><text x="478" y="204" font-size="21" fill="#4479ed" font-weight="400" text-anchor="start">A  ·  独立智能对象</text><text x="845" y="197" font-size="21" fill="#18a999" font-weight="600" text-anchor="start">组 A</text><text x="883" y="224" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">└  图层 A</text><rect x="65" y="244" width="300" height="42" rx="14" fill="#f1f5fb" stroke="none" /><text x="86" y="269" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">图层 B</text><rect x="455" y="244" width="300" height="42" rx="14" fill="#edf3ff" stroke="none" /><text x="478" y="269" font-size="21" fill="#4479ed" font-weight="400" text-anchor="start">B  ·  独立智能对象</text><text x="845" y="262" font-size="21" fill="#18a999" font-weight="600" text-anchor="start">组 B</text><text x="883" y="289" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">└  图层 B</text><rect x="65" y="309" width="300" height="42" rx="14" fill="#f1f5fb" stroke="none" /><text x="86" y="334" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">图层 C</text><rect x="455" y="309" width="300" height="42" rx="14" fill="#edf3ff" stroke="none" /><text x="478" y="334" font-size="21" fill="#4479ed" font-weight="400" text-anchor="start">C  ·  独立智能对象</text><text x="845" y="327" font-size="21" fill="#18a999" font-weight="600" text-anchor="start">组 C</text><text x="883" y="354" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">└  图层 C</text></g></svg>