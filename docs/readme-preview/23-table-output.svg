<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
<title id="title">输出方式：画面相似，图层组织不同</title><desc id="desc">独立单元格的实际间隔由行距、列距控制；不是选择该模式就会自动出现空隙。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="525" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">输出方式：画面相似，图层组织不同</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">独立单元格的实际间隔由行距、列距控制；不是选择该模式就会自动出现空隙。</text><rect x="40" y="125" width="550" height="360" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">单一形状：整张表的线条在同一层</text><rect x="610" y="125" width="550" height="360" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="634" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">独立单元格：每个格子单独一层</text><rect x="80" y="220" width="240" height="150" rx="0" fill="none" stroke="#4479ed" stroke-width="3"/><path d="M80 270.0 L320 270.0" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M80 320.0 L320 320.0" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M160.0 220 L160.0 370" fill="none" stroke="#4479ed" stroke-width="2" /><path d="M240.0 220 L240.0 370" fill="none" stroke="#4479ed" stroke-width="2" /><text x="355" y="269" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">图层面板</text><text x="355" y="310" font-size="22" fill="#4479ed" font-weight="650" text-anchor="start">表格线条</text><rect x="650" y="215" width="76" height="46" rx="2" fill="#edf3ff" stroke="#4479ed" /><text x="688" y="244" font-size="15" fill="#4479ed" font-weight="400" text-anchor="middle">R1C1</text><rect x="737" y="215" width="76" height="46" rx="2" fill="#edf3ff" stroke="#4479ed" /><text x="775" y="244" font-size="15" fill="#4479ed" font-weight="400" text-anchor="middle">R1C2</text><rect x="824" y="215" width="76" height="46" rx="2" fill="#edf3ff" stroke="#4479ed" /><text x="862" y="244" font-size="15" fill="#4479ed" font-weight="400" text-anchor="middle">R1C3</text><rect x="650" y="272" width="76" height="46" rx="2" fill="#edf3ff" stroke="#4479ed" /><text x="688" y="301" font-size="15" fill="#4479ed" font-weight="400" text-anchor="middle">R2C1</text><rect x="737" y="272" width="76" height="46" rx="2" fill="#edf3ff" stroke="#4479ed" /><text x="775" y="301" font-size="15" fill="#4479ed" font-weight="400" text-anchor="middle">R2C2</text><rect x="824" y="272" width="76" height="46" rx="2" fill="#edf3ff" stroke="#4479ed" /><text x="862" y="301" font-size="15" fill="#4479ed" font-weight="400" text-anchor="middle">R2C3</text><rect x="650" y="329" width="76" height="46" rx="2" fill="#edf3ff" stroke="#4479ed" /><text x="688" y="358" font-size="15" fill="#4479ed" font-weight="400" text-anchor="middle">R3C1</text><rect x="737" y="329" width="76" height="46" rx="2" fill="#edf3ff" stroke="#4479ed" /><text x="775" y="358" font-size="15" fill="#4479ed" font-weight="400" text-anchor="middle">R3C2</text><rect x="824" y="329" width="76" height="46" rx="2" fill="#edf3ff" stroke="#4479ed" /><text x="862" y="358" font-size="15" fill="#4479ed" font-weight="400" text-anchor="middle">R3C3</text><text x="942" y="249" font-size="22" fill="#18a999" font-weight="650" text-anchor="start">表格组</text><text x="951" y="289" font-size="19" fill="#172b4d" font-weight="400" text-anchor="start">├ R1C1</text><text x="951" y="325" font-size="19" fill="#172b4d" font-weight="400" text-anchor="start">├ R1C2</text><text x="951" y="361" font-size="19" fill="#172b4d" font-weight="400" text-anchor="start">└ …</text><text x="65" y="427" font-size="21" fill="#172b4d" font-weight="600" text-anchor="start">适合整体移动、整理和使用表格</text><text x="65" y="463" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">开启填充时，填充另成一层</text><text x="635" y="427" font-size="21" fill="#172b4d" font-weight="600" text-anchor="start">适合分别移动、改色或调整每一格</text><text x="635" y="463" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">图中拉开间隔，用于说明独立图层</text></g></svg>