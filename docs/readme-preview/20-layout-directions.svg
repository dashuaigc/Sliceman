<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img" aria-labelledby="title desc">
<title id="title">横排与竖排：改变排列方向，保持边缘间距</title><desc id="desc">横排设置左右相邻的距离，竖排设置上下相邻的距离；绿色虚线表示对齐基准。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="552" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">横排与竖排：改变排列方向，保持边缘间距</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">横排设置左右相邻的距离，竖排设置上下相邻的距离；绿色虚线表示对齐基准。</text><rect x="40" y="125" width="540" height="390" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">横排：从左到右排成一行</text><rect x="610" y="125" width="550" height="390" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="634" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">竖排：从上到下排成一列</text><rect x="90" y="255" width="95" height="105" rx="5" fill="#4479ed" stroke="none" /><text x="137.5" y="315.5" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">A</text><rect x="215" y="290" width="65" height="70" rx="5" fill="#18a999" stroke="none" /><text x="247.5" y="333.0" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">B</text><rect x="310" y="275" width="100" height="85" rx="5" fill="#f2b544" stroke="none" /><text x="360.0" y="325.5" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">C</text><path d="M75 360 L455 360" fill="none" stroke="#18a999" stroke-width="2" stroke-dasharray="7 5"/><text x="200" y="240" font-size="18" fill="#4479ed" font-weight="600" text-anchor="middle">30 px</text><text x="295" y="268" font-size="18" fill="#4479ed" font-weight="600" text-anchor="middle">30 px</text><text x="70" y="446" font-size="21" fill="#172b4d" font-weight="600" text-anchor="start">示例：底部对齐，对象间距 30 px</text><text x="70" y="484" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">可选：顶部 / 居中 / 底部</text><rect x="685" y="195" width="110" height="50" rx="5" fill="#4479ed" stroke="none" /><text x="740.0" y="228.0" font-size="23" fill="#fff" font-weight="600" text-anchor="middle">A</text><rect x="685" y="275" width="75" height="50" rx="5" fill="#18a999" stroke="none" /><text x="722.5" y="308.0" font-size="23" fill="#fff" font-weight="600" text-anchor="middle">B</text><rect x="685" y="355" width="140" height="50" rx="5" fill="#f2b544" stroke="none" /><text x="755.0" y="388.0" font-size="23" fill="#fff" font-weight="600" text-anchor="middle">C</text><path d="M685 185 L685 415" fill="none" stroke="#18a999" stroke-width="2" stroke-dasharray="7 5"/><text x="850" y="266" font-size="19" fill="#4479ed" font-weight="400" text-anchor="start">间距 30 px</text><text x="850" y="346" font-size="19" fill="#4479ed" font-weight="400" text-anchor="start">间距 30 px</text><text x="640" y="446" font-size="21" fill="#172b4d" font-weight="600" text-anchor="start">示例：左侧对齐，对象间距 30 px</text><text x="640" y="484" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">可选：左侧 / 居中 / 右侧</text></g></svg>