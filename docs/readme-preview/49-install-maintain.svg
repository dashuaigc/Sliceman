<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><title>一键安装版 · 更新与卸载</title><rect width="1200" height="420" rx="22" fill="#f3f7fc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="32" y="49" font-size="30" font-weight="700" fill="#172b4d">一键安装版 · 更新与卸载</text><text x="32" y="86" font-size="19" fill="#64748b">更新请继续使用 Setup ZIP；CCX 不会升级一键安装版。</text><rect x="32" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="62" cy="150" r="15" fill="#4479ed"/><text x="62" y="157" text-anchor="middle" font-size="19" fill="white">1</text><text x="86" y="157" font-size="23" font-weight="700" fill="#172b4d">更新</text><rect x="52" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="164" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">新版 Setup ZIP</text><text x="52" y="289" font-size="20" fill="#53647f">完整解压新版本</text><text x="52" y="320" font-size="20" fill="#53647f">再次运行一键安装.exe</text><text x="309" y="227" text-anchor="middle" font-size="26" fill="#4479ed">→</text><rect x="326" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="356" cy="150" r="15" fill="#4479ed"/><text x="356" y="157" text-anchor="middle" font-size="19" fill="white">2</text><text x="380" y="157" font-size="23" font-weight="700" fill="#172b4d">确认卸载</text><rect x="346" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="458" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">卸载.exe</text><text x="346" y="289" font-size="20" fill="#53647f">点击“确认卸载”才执行</text><text x="346" y="320" font-size="20" fill="#53647f">无需输入数字</text><text x="603" y="227" text-anchor="middle" font-size="26" fill="#4479ed">→</text><rect x="620" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="650" cy="150" r="15" fill="#4479ed"/><text x="650" y="157" text-anchor="middle" font-size="19" fill="white">3</text><text x="674" y="157" font-size="23" font-weight="700" fill="#172b4d">等待完成</text><rect x="640" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="752" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">退出 Photoshop</text><text x="640" y="289" font-size="20" fill="#53647f">保存工作并退出 PS</text><text x="640" y="320" font-size="20" fill="#53647f">等待安装 / 卸载完成</text><text x="897" y="227" text-anchor="middle" font-size="26" fill="#4479ed">→</text><rect x="914" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="944" cy="150" r="15" fill="#4479ed"/><text x="944" y="157" text-anchor="middle" font-size="19" fill="white">4</text><text x="968" y="157" font-size="23" font-weight="700" fill="#172b4d">保留内容</text><rect x="934" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="1046" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">其他插件保留</text><text x="934" y="289" font-size="20" fill="#53647f">仅处理一键安装版</text><text x="934" y="320" font-size="20" fill="#53647f">CC 版与本地设置保留</text></g></svg>