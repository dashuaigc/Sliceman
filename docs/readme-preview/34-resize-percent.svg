<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" role="img" aria-labelledby="title desc">
<title id="title">06 / 百分比缩放</title><desc id="desc">输入 50，即宽和高分别变为原来的 50%</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="475" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">06 / 百分比缩放</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">输入 50，即宽和高分别变为原来的 50%</text><rect x="40" y="122" width="440" height="270" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">原图：1600 × 800</text><rect x="700" y="122" width="460" height="270" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="724" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">结果：800 × 400</text><svg x="140.0" y="205.0" width="240" height="120.0" viewBox="0 0 200 100" preserveAspectRatio="none"><rect x="0" y="0" width="200" height="100" rx="0" fill="#83c8f4" stroke="none" /><circle cx="54" cy="30" r="12" fill="#ffd168"/><path d="M0 100V80L55 47L112 100Z" fill="#42b4a0"/><path d="M60 100L137 42L200 77V100Z" fill="#23866f"/></svg><path d="M525 265 L655 265" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><svg x="870.0" y="235.0" width="120" height="60" viewBox="0 0 200 100" preserveAspectRatio="none"><rect x="0" y="0" width="200" height="100" rx="0" fill="#83c8f4" stroke="none" /><circle cx="54" cy="30" r="12" fill="#ffd168"/><path d="M0 100V80L55 47L112 100Z" fill="#42b4a0"/><path d="M60 100L137 42L200 77V100Z" fill="#23866f"/></svg><text x="40" y="434" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">宽、高都乘以 50%；保持比例，不裁切，也不补边。</text></g></svg>