<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="464" viewBox="0 0 1200 464" role="img" aria-labelledby="title desc">
<title id="title">拆成图层，有两条路</title><desc id="desc">分割的结果留在 Photoshop 里；要保存为图片文件，再使用「切图」。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="464" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">拆成图层，有两条路</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">分割的结果留在 Photoshop 里；要保存为图片文件，再使用「切图」。</text><rect x="40" y="122" width="542" height="306" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">智能分割：识别分开的像素</text><rect x="606" y="122" width="554" height="306" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="630" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">参考线分割：按你画好的线切</text><rect x="66" y="192" width="200" height="146" rx="4" fill="url(#checker)" stroke="none" /><circle cx="100" cy="226" r="20" fill="#4479ed"/><circle cx="204" cy="284" r="20" fill="#18a999"/><circle cx="160" cy="220" r="20" fill="#f2b544"/><path d="M285 266 L323 266" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="345" y="225" width="54" height="80" rx="14" fill="#edf3ff" stroke="none" /><circle cx="372" cy="253" r="15" fill="#4479ed"/><text x="372" y="291" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">0</text><rect x="413" y="225" width="54" height="80" rx="14" fill="#edf3ff" stroke="none" /><circle cx="440" cy="253" r="15" fill="#f2b544"/><text x="440" y="291" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">1</text><rect x="481" y="225" width="54" height="80" rx="14" fill="#edf3ff" stroke="none" /><circle cx="508" cy="253" r="15" fill="#18a999"/><text x="508" y="291" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">2</text><svg x="632" y="192" width="206" height="146" viewBox="0 0 200 100" preserveAspectRatio="none"><rect x="0" y="0" width="200" height="100" rx="0" fill="#83c8f4" stroke="none" /><circle cx="54" cy="30" r="12" fill="#ffd168"/><path d="M0 100V80L55 47L112 100Z" fill="#42b4a0"/><path d="M60 100L137 42L200 77V100Z" fill="#23866f"/></svg><path d="M735 192 L735 338" fill="none" stroke="#18a999" stroke-width="2" /><path d="M632 265 L838 265" fill="none" stroke="#18a999" stroke-width="2" /><path d="M852 266 L885 266" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="908" y="197" width="82" height="64" rx="4" fill="#e8f4f1" stroke="#18a999" /><text x="949" y="236" font-size="20" fill="#18a999" font-weight="600" text-anchor="middle">0</text><rect x="1003" y="197" width="82" height="64" rx="4" fill="#e8f4f1" stroke="#18a999" /><text x="1044" y="236" font-size="20" fill="#18a999" font-weight="600" text-anchor="middle">1</text><rect x="908" y="275" width="82" height="64" rx="4" fill="#e8f4f1" stroke="#18a999" /><text x="949" y="314" font-size="20" fill="#18a999" font-weight="600" text-anchor="middle">2</text><rect x="1003" y="275" width="82" height="64" rx="4" fill="#e8f4f1" stroke="#18a999" /><text x="1044" y="314" font-size="20" fill="#18a999" font-weight="600" text-anchor="middle">3</text><text x="66" y="396" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">适合透明底素材；原图层保留</text><text x="632" y="396" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">适合规则分块；空格自动跳过</text></g></svg>