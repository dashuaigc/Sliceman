<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="615" viewBox="0 0 1200 615" role="img" aria-labelledby="title desc">
<title id="title">扩展画布与画布边距：装得下，再留一点空白</title><desc id="desc">假设原画布宽 200 px，排版后的对象最右侧到达 240 px；本例只有右侧超出。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="615" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">扩展画布与画布边距：装得下，再留一点空白</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">假设原画布宽 200 px，排版后的对象最右侧到达 240 px；本例只有右侧超出。</text><rect x="40" y="125" width="350" height="367" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">关闭自动扩展画布</text><rect x="70" y="225" width="200" height="160" rx="0" fill="#f0f5fc" stroke="#4479ed" stroke-width="3"/><rect x="90" y="280" width="60" height="50" rx="4" fill="#4479ed" stroke="none" /><text x="120.0" y="312" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">A</text><rect x="170" y="280" width="60" height="50" rx="4" fill="#18a999" stroke="none" /><text x="200.0" y="312" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">B</text><rect x="250" y="280" width="60" height="50" rx="4" fill="#f2b544" stroke="none" /><text x="280.0" y="312" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">C</text><path d="M270 260 L270 350" fill="none" stroke="#df6675" stroke-width="2" stroke-dasharray="7 5"/><text x="240" y="208" font-size="18" fill="#c14c61" font-weight="600" text-anchor="start">超出 40 px</text><text x="215" y="431" font-size="22" fill="#172b4d" font-weight="600" text-anchor="middle">画布仍为 200 px 宽</text><text x="215" y="467" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle">C 的一部分落在画布外</text><rect x="425" y="125" width="350" height="367" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="449" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">开启：边距 0 px</text><rect x="455" y="225" width="240" height="160" rx="0" fill="#f0f5fc" stroke="#4479ed" stroke-width="3"/><path d="M655 225 L655 385" fill="none" stroke="#9aa8bc" stroke-width="2" stroke-dasharray="7 5"/><rect x="475" y="280" width="60" height="50" rx="4" fill="#4479ed" stroke="none" /><text x="505.0" y="312" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">A</text><rect x="555" y="280" width="60" height="50" rx="4" fill="#18a999" stroke="none" /><text x="585.0" y="312" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">B</text><rect x="635" y="280" width="60" height="50" rx="4" fill="#f2b544" stroke="none" /><text x="665.0" y="312" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">C</text><text x="600" y="431" font-size="22" fill="#172b4d" font-weight="600" text-anchor="middle">画布扩到 240 px 宽</text><text x="600" y="467" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle">右边刚好容纳所有对象</text><rect x="810" y="125" width="350" height="367" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="834" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">开启：边距 20 px</text><rect x="1080" y="225" width="20" height="160" rx="0" fill="#fff0ca" stroke="none" /><rect x="840" y="225" width="260" height="160" rx="0" fill="#f0f5fc" stroke="#4479ed" stroke-width="3"/><rect x="1080" y="227" width="18" height="156" rx="0" fill="#fff0ca" stroke="none" /><path d="M1040 225 L1040 385" fill="none" stroke="#9aa8bc" stroke-width="2" stroke-dasharray="7 5"/><rect x="860" y="280" width="60" height="50" rx="4" fill="#4479ed" stroke="none" /><text x="890.0" y="312" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">A</text><rect x="940" y="280" width="60" height="50" rx="4" fill="#18a999" stroke="none" /><text x="970.0" y="312" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">B</text><rect x="1020" y="280" width="60" height="50" rx="4" fill="#f2b544" stroke="none" /><text x="1050.0" y="312" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">C</text><text x="1090" y="208" font-size="18" fill="#af7a17" font-weight="600" text-anchor="middle">20 px</text><text x="985" y="431" font-size="22" fill="#172b4d" font-weight="600" text-anchor="middle">画布扩到 260 px 宽</text><text x="985" y="467" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle">右边再留 20 px 空白</text><text x="40" y="538" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">蓝框：实际画布边界　灰色虚线：原画布边界　浅黄色区域：新增边距</text><text x="40" y="577" font-size="22" fill="#172b4d" font-weight="600" text-anchor="start">只扩展真正超出的方向；未超出的边保持原样，不会自动给四周都补上边距。</text></g></svg>