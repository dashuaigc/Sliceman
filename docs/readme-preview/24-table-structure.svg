<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">看开关前后：到底少了哪些线？</title><desc id="desc">每组都是同一张 5 行 6 列的表格。蓝色强调当前控制的线，灰色线保持不变；颜色仅用于讲解。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="1060" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">看开关前后：到底少了哪些线？</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">每组都是同一张 5 行 6 列的表格。蓝色强调当前控制的线，灰色线保持不变；颜色仅用于讲解。</text><rect x="40" y="130" width="1120" height="278" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="172" font-size="26" fill="#172b4d" font-weight="700" text-anchor="start">外边框</text><text x="64" y="208" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">控制整张表最外侧的一圈</text><text x="64" y="281" font-size="19" fill="#4479ed" font-weight="600" text-anchor="start">只切换这一项</text><text x="64" y="313" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">另两项保持开启</text><rect x="365" y="154" width="82" height="32" rx="16" fill="#e3f5ef" stroke="none" /><text x="406" y="177" font-size="20" fill="#18a999" font-weight="650" text-anchor="middle">开启</text><rect x="365" y="212" width="300" height="150" rx="0" fill="none" stroke="#4479ed" stroke-width="4"/><path d="M365 242h300" stroke="#8d9bb0" stroke-width="2"/><path d="M365 272h300" stroke="#8d9bb0" stroke-width="2"/><path d="M365 302h300" stroke="#8d9bb0" stroke-width="2"/><path d="M365 332h300" stroke="#8d9bb0" stroke-width="2"/><path d="M415 212v150" stroke="#8d9bb0" stroke-width="2"/><path d="M465 212v150" stroke="#8d9bb0" stroke-width="2"/><path d="M515 212v150" stroke="#8d9bb0" stroke-width="2"/><path d="M565 212v150" stroke="#8d9bb0" stroke-width="2"/><path d="M615 212v150" stroke="#8d9bb0" stroke-width="2"/><text x="515" y="391" font-size="17" fill="#172b4d" font-weight="600" text-anchor="middle">蓝色外圈：封闭整张表</text><rect x="805" y="154" width="82" height="32" rx="16" fill="#edf0f5" stroke="none" /><text x="846" y="177" font-size="20" fill="#64748b" font-weight="650" text-anchor="middle">关闭</text><path d="M805 242h300" stroke="#8d9bb0" stroke-width="2"/><path d="M805 272h300" stroke="#8d9bb0" stroke-width="2"/><path d="M805 302h300" stroke="#8d9bb0" stroke-width="2"/><path d="M805 332h300" stroke="#8d9bb0" stroke-width="2"/><path d="M855 212v150" stroke="#8d9bb0" stroke-width="2"/><path d="M905 212v150" stroke="#8d9bb0" stroke-width="2"/><path d="M955 212v150" stroke="#8d9bb0" stroke-width="2"/><path d="M1005 212v150" stroke="#8d9bb0" stroke-width="2"/><path d="M1055 212v150" stroke="#8d9bb0" stroke-width="2"/><text x="955" y="391" font-size="17" fill="#172b4d" font-weight="600" text-anchor="middle">外圈消失，内部横线和竖线保留</text><path d="M710 287 L765 287" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="430" width="1120" height="278" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="472" font-size="26" fill="#172b4d" font-weight="700" text-anchor="start">内横线</text><text x="64" y="508" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">控制上下各行之间的分隔线</text><text x="64" y="581" font-size="19" fill="#4479ed" font-weight="600" text-anchor="start">只切换这一项</text><text x="64" y="613" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">另两项保持开启</text><rect x="365" y="454" width="82" height="32" rx="16" fill="#e3f5ef" stroke="none" /><text x="406" y="477" font-size="20" fill="#18a999" font-weight="650" text-anchor="middle">开启</text><rect x="365" y="512" width="300" height="150" rx="0" fill="none" stroke="#8d9bb0" stroke-width="2"/><path d="M365 542h300" stroke="#4479ed" stroke-width="4"/><path d="M365 572h300" stroke="#4479ed" stroke-width="4"/><path d="M365 602h300" stroke="#4479ed" stroke-width="4"/><path d="M365 632h300" stroke="#4479ed" stroke-width="4"/><path d="M415 512v150" stroke="#8d9bb0" stroke-width="2"/><path d="M465 512v150" stroke="#8d9bb0" stroke-width="2"/><path d="M515 512v150" stroke="#8d9bb0" stroke-width="2"/><path d="M565 512v150" stroke="#8d9bb0" stroke-width="2"/><path d="M615 512v150" stroke="#8d9bb0" stroke-width="2"/><text x="515" y="691" font-size="17" fill="#172b4d" font-weight="600" text-anchor="middle">4 条蓝色横线：分成 5 行</text><rect x="805" y="454" width="82" height="32" rx="16" fill="#edf0f5" stroke="none" /><text x="846" y="477" font-size="20" fill="#64748b" font-weight="650" text-anchor="middle">关闭</text><rect x="805" y="512" width="300" height="150" rx="0" fill="none" stroke="#8d9bb0" stroke-width="2"/><path d="M855 512v150" stroke="#8d9bb0" stroke-width="2"/><path d="M905 512v150" stroke="#8d9bb0" stroke-width="2"/><path d="M955 512v150" stroke="#8d9bb0" stroke-width="2"/><path d="M1005 512v150" stroke="#8d9bb0" stroke-width="2"/><path d="M1055 512v150" stroke="#8d9bb0" stroke-width="2"/><text x="955" y="691" font-size="17" fill="#172b4d" font-weight="600" text-anchor="middle">横线消失，外框和竖线保留</text><path d="M710 587 L765 587" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="730" width="1120" height="278" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="772" font-size="26" fill="#172b4d" font-weight="700" text-anchor="start">内竖线</text><text x="64" y="808" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">控制左右各列之间的分隔线</text><text x="64" y="881" font-size="19" fill="#4479ed" font-weight="600" text-anchor="start">只切换这一项</text><text x="64" y="913" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">另两项保持开启</text><rect x="365" y="754" width="82" height="32" rx="16" fill="#e3f5ef" stroke="none" /><text x="406" y="777" font-size="20" fill="#18a999" font-weight="650" text-anchor="middle">开启</text><rect x="365" y="812" width="300" height="150" rx="0" fill="none" stroke="#8d9bb0" stroke-width="2"/><path d="M365 842h300" stroke="#8d9bb0" stroke-width="2"/><path d="M365 872h300" stroke="#8d9bb0" stroke-width="2"/><path d="M365 902h300" stroke="#8d9bb0" stroke-width="2"/><path d="M365 932h300" stroke="#8d9bb0" stroke-width="2"/><path d="M415 812v150" stroke="#4479ed" stroke-width="4"/><path d="M465 812v150" stroke="#4479ed" stroke-width="4"/><path d="M515 812v150" stroke="#4479ed" stroke-width="4"/><path d="M565 812v150" stroke="#4479ed" stroke-width="4"/><path d="M615 812v150" stroke="#4479ed" stroke-width="4"/><text x="515" y="991" font-size="17" fill="#172b4d" font-weight="600" text-anchor="middle">5 条蓝色竖线：分成 6 列</text><rect x="805" y="754" width="82" height="32" rx="16" fill="#edf0f5" stroke="none" /><text x="846" y="777" font-size="20" fill="#64748b" font-weight="650" text-anchor="middle">关闭</text><rect x="805" y="812" width="300" height="150" rx="0" fill="none" stroke="#8d9bb0" stroke-width="2"/><path d="M805 842h300" stroke="#8d9bb0" stroke-width="2"/><path d="M805 872h300" stroke="#8d9bb0" stroke-width="2"/><path d="M805 902h300" stroke="#8d9bb0" stroke-width="2"/><path d="M805 932h300" stroke="#8d9bb0" stroke-width="2"/><text x="955" y="991" font-size="17" fill="#172b4d" font-weight="600" text-anchor="middle">竖线消失，外框和横线保留</text><path d="M710 887 L765 887" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/></g></svg>