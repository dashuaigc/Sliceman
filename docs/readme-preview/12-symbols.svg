<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" role="img" aria-labelledby="title desc">
<title id="title">Symbols：以定位格统一图标的导出范围</title><desc id="desc">图标未超出时，按定位格尺寸出图；超出时对称扩边，保留定位格中心作为输出中心。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="475" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">Symbols：以定位格统一图标的导出范围</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">图标未超出时，按定位格尺寸出图；超出时对称扩边，保留定位格中心作为输出中心。</text><rect x="40" y="122" width="340" height="310" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">一个图标，一个组</text><rect x="430" y="122" width="350" height="310" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="454" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">定位格定义基准范围</text><rect x="830" y="122" width="330" height="310" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="854" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">导出结果</text><text x="68" y="212" font-size="24" fill="#4479ed" font-weight="650" text-anchor="start">组：Icon_Coin</text><text x="90" y="268" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">├  金币图案</text><text x="90" y="320" font-size="22" fill="#18a999" font-weight="400" text-anchor="start">└  定位格 01</text><text x="68" y="390" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">定位格可隐藏，但需在组内</text><rect x="499" y="197" width="200" height="178" rx="0" fill="url(#checker)" stroke="none" /><circle cx="599" cy="286" r="51" fill="#f2b544" stroke="#d39529" stroke-width="4"/><text x="599" y="302" font-size="44" fill="#fff7dd" font-weight="700" text-anchor="middle">S</text><rect x="894" y="197" width="200" height="178" rx="0" fill="url(#checker)" stroke="none" /><circle cx="994" cy="286" r="51" fill="#f2b544" stroke="#d39529" stroke-width="4"/><text x="994" y="302" font-size="44" fill="#fff7dd" font-weight="700" text-anchor="middle">S</text><rect x="499" y="197" width="200" height="178" rx="0" fill="none" stroke="#18a999" stroke-width="3" stroke-dasharray="8 5"/><text x="850" y="404" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">只导出图案，定位格不出图</text></g></svg>