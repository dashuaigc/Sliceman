<text x="40" y="52" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">Sliceman</text><text x="40" y="88" font-size="20" fill="#9eafc9" font-weight="400" text-anchor="start">面向 UI、游戏美术与日常设计的 Photoshop 效率工具</text><text x="44" y="173" font-size="44" fill="#ffffff" font-weight="700" text-anchor="start">把重复操作交给 Sliceman</text><text x="44" y="224" font-size="26" fill="#afc3e4" font-weight="400" text-anchor="start">整理图层 · 制作版面 · 批量输出</text><text x="44" y="325" font-size="56" fill="#7cafff" font-weight="700" text-anchor="start">10</text><text x="114" y="322" font-size="20" fill="#d0dcf0" font-weight="400" text-anchor="start">个功能入口</text><text x="294" y="325" font-size="56" fill="#7cafff" font-weight="700" text-anchor="start">3</text><text x="364" y="322" font-size="20" fill="#d0dcf0" font-weight="400" text-anchor="start">步批量改尺寸</text><text x="544" y="325" font-size="56" fill="#7cafff" font-weight="700" text-anchor="start">1</text><text x="614" y="322" font-size="20" fill="#d0dcf0" font-weight="400" text-anchor="start">套顺手的工作流</text><rect x="867" y="138" width="285" height="218" rx="14" fill="#192c4c" stroke="#2d466a" /><text x="888" y="184" font-size="17" fill="#afc3e4" font-weight="400" text-anchor="start">Button_Play</text><text x="1052" y="184" font-size="17" fill="#8ddccc" font-weight="600" text-anchor="start">Icon_01</text><text x="888" y="244" font-size="17" fill="#afc3e4" font-weight="400" text-anchor="start">Button_Shop</text><text x="1052" y="244" font-size="17" fill="#8ddccc" font-weight="600" text-anchor="start">Icon_02</text><text x="888" y="304" font-size="17" fill="#afc3e4" font-weight="400" text-anchor="start">Button_Close</text><text x="1052" y="304" font-size="17" fill="#8ddccc" font-weight="600" text-anchor="start">Icon_03</text><text x="44" y="401" font-size="17" fill="#8198bd" font-weight="600" text-anchor="start">PHOTOSHOP WORKFLOW TOOLKIT</text></g></svg>