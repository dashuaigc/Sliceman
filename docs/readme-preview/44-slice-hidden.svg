<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title desc">
<title id="title">包含隐藏图层：眼睛关闭的内容要不要出图？</title><desc id="desc">默认开启。图例为普通图层；红色排除规则始终有效。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="495" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">包含隐藏图层：眼睛关闭的内容要不要出图？</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">默认开启。图例为普通图层；红色排除规则始终有效。</text><rect x="40" y="125" width="350" height="285" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">同一份源文件</text><rect x="425" y="125" width="350" height="285" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="449" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">关闭</text><rect x="810" y="125" width="350" height="285" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="834" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">开启</text><text x="65" y="205" font-size="21" fill="#172b4d" font-weight="600" text-anchor="start">A：可见</text><text x="65" y="263" font-size="21" fill="#64748b" font-weight="600" text-anchor="start">B：隐藏</text><text x="65" y="321" font-size="21" fill="#d8586d" font-weight="600" text-anchor="start">C：红色 + 隐藏</text><text x="450" y="205" font-size="22" fill="#4479ed" font-weight="600" text-anchor="start">A.png</text><text x="835" y="205" font-size="22" fill="#4479ed" font-weight="600" text-anchor="start">A.png</text><text x="835" y="263" font-size="22" fill="#4479ed" font-weight="600" text-anchor="start">B.png</text><text x="40" y="455" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">开启后，隐藏的 B 也参与导出；红色 C 无论是否隐藏，都不导出。</text></g></svg>