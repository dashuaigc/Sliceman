<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="425" viewBox="0 0 1200 425" role="img" aria-labelledby="title desc">
<title id="title">把常用参考线存下来，下次直接用</title><desc id="desc">快速参考线、最近使用和收藏，都只作用于当前激活的文档。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="425" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">把常用参考线存下来，下次直接用</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">快速参考线、最近使用和收藏，都只作用于当前激活的文档。</text><rect x="40" y="135" width="330" height="248" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="173" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">建立版面</text><text x="62" y="353" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">打开 PS 原生弹窗并确认</text><path d="M385 260 L420 260" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="105" y="195" width="200" height="122" rx="3" fill="#eef4fe" stroke="none" /><path d="M145 195 L145 317" fill="none" stroke="#18a999" stroke-width="2" /><path d="M185 195 L185 317" fill="none" stroke="#18a999" stroke-width="2" /><path d="M225 195 L225 317" fill="none" stroke="#18a999" stroke-width="2" /><path d="M265 195 L265 317" fill="none" stroke="#18a999" stroke-width="2" /><path d="M105 236 L305 236" fill="none" stroke="#18a999" stroke-width="2" /><path d="M105 277 L305 277" fill="none" stroke="#18a999" stroke-width="2" /><rect x="435" y="135" width="330" height="248" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="459" y="173" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">保存记录</text><text x="457" y="353" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">最近使用，或收藏并命名</text><path d="M780 260 L815 260" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="461" y="202" width="278" height="26" rx="5" fill="#edf3ff" stroke="none" /><rect x="461" y="237" width="278" height="26" rx="5" fill="#edf3ff" stroke="none" /><rect x="461" y="272" width="278" height="26" rx="5" fill="#edf3ff" stroke="none" /><text x="477" y="222" font-size="17" fill="#4479ed" font-weight="400" text-anchor="start">UI · 12 列版面</text><rect x="830" y="135" width="330" height="248" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="854" y="173" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">下次复用</text><text x="852" y="353" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">选择记录，点击「应用」</text><rect x="895" y="195" width="200" height="122" rx="3" fill="#eef4fe" stroke="none" /><path d="M935 195 L935 317" fill="none" stroke="#18a999" stroke-width="2" /><path d="M975 195 L975 317" fill="none" stroke="#18a999" stroke-width="2" /><path d="M1015 195 L1015 317" fill="none" stroke="#18a999" stroke-width="2" /><path d="M1055 195 L1055 317" fill="none" stroke="#18a999" stroke-width="2" /><path d="M895 236 L1095 236" fill="none" stroke="#18a999" stroke-width="2" /><path d="M895 277 L1095 277" fill="none" stroke="#18a999" stroke-width="2" /></g></svg>