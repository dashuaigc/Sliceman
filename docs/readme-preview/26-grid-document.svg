<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img" aria-labelledby="title desc">
<title id="title">在新 PSD 中创建：决定定位格放在哪里</title><desc id="desc">开启时可直接新建文档；关闭时需要先打开一个文档。右图为同文档关系示意，不代表自动避开原有设计。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="515" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">在新 PSD 中创建：决定定位格放在哪里</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">开启时可直接新建文档；关闭时需要先打开一个文档。右图为同文档关系示意，不代表自动避开原有设计。</text><rect x="40" y="125" width="550" height="350" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">开启：新建一个文档放定位格</text><rect x="610" y="125" width="550" height="350" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="634" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">关闭：放进当前打开的文档</text><rect x="70" y="207" width="175" height="188" rx="4" fill="#f5f7fb" stroke="#aebbd0" /><text x="86" y="235" font-size="21" fill="#64748b" font-weight="600" text-anchor="start">原文档</text><rect x="90" y="268" width="130" height="75" rx="6" fill="#cad3e2" stroke="none" /><text x="155" y="313" font-size="19" fill="#64748b" font-weight="400" text-anchor="middle">原有设计</text><path d="M259 303 L298 303" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="207" width="240" height="188" rx="4" fill="#f5f8ff" stroke="#4479ed" /><text x="337" y="235" font-size="21" fill="#4479ed" font-weight="600" text-anchor="start">新文档</text><rect x="346" y="260" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="369.0" y="289.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">01</text><rect x="404" y="260" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="427.0" y="289.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">02</text><rect x="462" y="260" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="485.0" y="289.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">03</text><rect x="346" y="318" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="369.0" y="347.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">04</text><rect x="404" y="318" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="427.0" y="347.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">05</text><rect x="462" y="318" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="485.0" y="347.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">06</text><rect x="650" y="207" width="470" height="188" rx="4" fill="#f5f8ff" stroke="#4479ed" /><text x="670" y="235" font-size="21" fill="#4479ed" font-weight="600" text-anchor="start">当前文档</text><rect x="675" y="268" width="145" height="75" rx="6" fill="#cad3e2" stroke="none" /><text x="747" y="313" font-size="19" fill="#64748b" font-weight="400" text-anchor="middle">原有设计</text><rect x="893" y="260" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="916.0" y="289.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">01</text><rect x="951" y="260" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="974.0" y="289.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">02</text><rect x="1009" y="260" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="1032.0" y="289.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">03</text><rect x="893" y="318" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="916.0" y="347.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">04</text><rect x="951" y="318" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="974.0" y="347.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">05</text><rect x="1009" y="318" width="46" height="46" rx="3" fill="#dce8ff" stroke="#4479ed" /><text x="1032.0" y="347.0" font-size="16" fill="#4479ed" font-weight="600" text-anchor="middle">06</text><text x="65" y="443" font-size="21" fill="#172b4d" font-weight="600" text-anchor="start">原文档保留，新文档按定位格计算尺寸</text><text x="635" y="443" font-size="21" fill="#172b4d" font-weight="600" text-anchor="start">原有内容保留，在同一文档新增形状层</text></g></svg>