<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img" aria-labelledby="title desc">
<title id="title">保持元素完整：分开的像素，也可以属于同一个元素</title><desc id="desc">这个开关用于智能分割，默认关闭。开启后，会尝试把同一元素中相近的断开部分放到一起。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="612" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">保持元素完整：分开的像素，也可以属于同一个元素</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">这个开关用于智能分割，默认关闭。开启后，会尝试把同一元素中相近的断开部分放到一起。</text><rect x="40" y="125" width="350" height="362" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">原素材：一个断开的字母 i</text><rect x="85" y="195" width="260" height="208" rx="4" fill="url(#checker)" stroke="none" /><circle cx="215" cy="240" r="20" fill="#4479ed"/><rect x="195" y="278" width="40" height="100" rx="5" fill="#4479ed" stroke="none" /><text x="215" y="442" font-size="20" fill="#172b4d" font-weight="600" text-anchor="middle">圆点与主体之间有透明间隔</text><text x="215" y="471" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">它们在视觉上属于同一个字母</text><rect x="425" y="125" width="350" height="362" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="449" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">关闭：按相连像素拆开</text><rect x="470" y="195" width="260" height="208" rx="4" fill="url(#checker)" stroke="none" /><circle cx="600" cy="240" r="20" fill="#4479ed"/><rect x="580" y="278" width="40" height="100" rx="5" fill="#4479ed" stroke="none" /><rect x="567" y="207" width="66" height="66" rx="5" fill="none" stroke="#18a999" stroke-width="3" stroke-dasharray="7 5"/><rect x="567" y="270" width="66" height="122" rx="5" fill="none" stroke="#f2b544" stroke-width="3" stroke-dasharray="7 5"/><text x="647" y="247" font-size="18" fill="#18a999" font-weight="600" text-anchor="start">图层 0</text><text x="647" y="338" font-size="18" fill="#af7a17" font-weight="600" text-anchor="start">图层 1</text><text x="600" y="442" font-size="20" fill="#172b4d" font-weight="600" text-anchor="middle">圆点、主体分别成为图层</text><text x="600" y="471" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">适合希望拆开每块内容的情况</text><rect x="810" y="125" width="350" height="362" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="834" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">开启：尝试保留整个元素</text><rect x="855" y="195" width="260" height="208" rx="4" fill="url(#checker)" stroke="none" /><circle cx="985" cy="240" r="20" fill="#4479ed"/><rect x="965" y="278" width="40" height="100" rx="5" fill="#4479ed" stroke="none" /><rect x="950" y="205" width="70" height="190" rx="5" fill="none" stroke="#18a999" stroke-width="3" stroke-dasharray="7 5"/><text x="1033" y="310" font-size="18" fill="#18a999" font-weight="600" text-anchor="start">图层 0</text><text x="985" y="442" font-size="20" fill="#172b4d" font-weight="600" text-anchor="middle">圆点、主体保留在同一层</text><text x="985" y="471" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">适合希望保留断开部件的情况</text><text x="40" y="536" font-size="22" fill="#64748b" font-weight="400" text-anchor="start">虚线表示分割后的图层范围，不是新增描边；开启后也不会填上中间的透明间隔。</text><text x="40" y="573" font-size="22" fill="#64748b" font-weight="400" text-anchor="start">这是典型效果示意。实际分组取决于素材中的距离与排列，请检查分割结果。</text></g></svg>