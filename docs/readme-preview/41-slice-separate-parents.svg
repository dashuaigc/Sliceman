<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="536" viewBox="0 0 1200 536" role="img" aria-labelledby="title desc">
<title id="title">05 / 不同父组：蓝色图层不会跨组合并</title><desc id="desc">深度相同不代表同一层级；必须是同一个直接父容器。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="536" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">05 / 不同父组：蓝色图层不会跨组合并</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">深度相同不代表同一层级；必须是同一个直接父容器。</text><rect x="40" y="122" width="520" height="336" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">图层面板：从上到下</text><rect x="690" y="122" width="470" height="336" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="714" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">导出结果</text><path d="M590 260 L654 260" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="180" width="45" height="30" rx="5" fill="#edf3ff" stroke="none" /><text x="86" y="202" font-size="17" fill="#8d9bb0" font-weight="600" text-anchor="middle">无</text><text x="122" y="202" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">组  Group_A</text><rect x="92" y="226" width="45" height="30" rx="5" fill="#edf3ff" stroke="none" /><text x="114" y="248" font-size="17" fill="#4479ed" font-weight="600" text-anchor="middle">蓝</text><text x="150" y="248" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">层  Top</text><rect x="92" y="272" width="45" height="30" rx="5" fill="#edf3ff" stroke="none" /><text x="114" y="294" font-size="17" fill="#4479ed" font-weight="600" text-anchor="middle">蓝</text><text x="150" y="294" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">层  Bottom</text><rect x="64" y="318" width="45" height="30" rx="5" fill="#edf3ff" stroke="none" /><text x="86" y="340" font-size="17" fill="#8d9bb0" font-weight="600" text-anchor="middle">无</text><text x="122" y="340" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">组  Group_B</text><rect x="92" y="364" width="45" height="30" rx="5" fill="#edf3ff" stroke="none" /><text x="114" y="386" font-size="17" fill="#4479ed" font-weight="600" text-anchor="middle">蓝</text><text x="150" y="386" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">层  Top</text><rect x="92" y="410" width="45" height="30" rx="5" fill="#edf3ff" stroke="none" /><text x="114" y="432" font-size="17" fill="#4479ed" font-weight="600" text-anchor="middle">蓝</text><text x="150" y="432" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">层  Bottom</text><text x="715" y="203" font-size="24" fill="#4479ed" font-weight="650" text-anchor="start">Group_A_Bottom.png</text><text x="715" y="234" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">Group_A 中的两层合并</text><text x="715" y="286" font-size="24" fill="#4479ed" font-weight="650" text-anchor="start">Group_B_Bottom.png</text><text x="715" y="317" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">Group_B 中的两层合并</text><text x="40" y="506" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">想把蓝色图层分成多批导出，就分别放进不同的普通组。</text></g></svg>