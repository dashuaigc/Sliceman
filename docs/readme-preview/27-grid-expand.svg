<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
<title id="title">自动扩展画布：在当前文档中，为定位格腾出空间</title><desc id="desc">仅在当前文档创建时有效。例：3 个 100 × 100 定位格，自动间距 13 px，所需宽度为 352 px。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="525" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">自动扩展画布：在当前文档中，为定位格腾出空间</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">仅在当前文档创建时有效。例：3 个 100 × 100 定位格，自动间距 13 px，所需宽度为 352 px。</text><rect x="40" y="125" width="550" height="360" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">关闭：画布保持原尺寸</text><rect x="135" y="235" width="280" height="160" rx="0" fill="#edf3fb" stroke="#4479ed" stroke-width="3"/><rect x="112" y="265" width="100" height="100" rx="0" fill="#dce8ff" stroke="#18a999" /><text x="162" y="323" font-size="22" fill="#18a999" font-weight="600" text-anchor="middle">01</text><rect x="225" y="265" width="100" height="100" rx="0" fill="#dce8ff" stroke="#18a999" /><text x="275" y="323" font-size="22" fill="#18a999" font-weight="600" text-anchor="middle">02</text><rect x="338" y="265" width="100" height="100" rx="0" fill="#dce8ff" stroke="#18a999" /><text x="388" y="323" font-size="22" fill="#18a999" font-weight="600" text-anchor="middle">03</text><text x="315" y="205" font-size="22" fill="#4479ed" font-weight="600" text-anchor="middle">原画布 280 × 160</text><text x="65" y="435" font-size="20" fill="#172b4d" font-weight="600" text-anchor="start">定位格可能超出画布，尺寸不会被压小</text><text x="65" y="468" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">图中两侧的定位格都超出原画布</text><rect x="610" y="125" width="550" height="360" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="634" y="163" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">开启：不足的方向从中心向两侧扩展</text><rect x="705" y="235" width="280" height="160" rx="0" fill="#edf3fb" stroke="#4479ed" stroke-width="3"/><rect x="669" y="235" width="352" height="160" rx="0" fill="#edf3fb" stroke="#4479ed" stroke-width="3"/><rect x="705" y="235" width="280" height="160" rx="0" fill="none" stroke="#8d9bb0" stroke-width="2" stroke-dasharray="7 5"/><rect x="682" y="265" width="100" height="100" rx="0" fill="#dce8ff" stroke="#18a999" /><text x="732" y="323" font-size="22" fill="#18a999" font-weight="600" text-anchor="middle">01</text><rect x="795" y="265" width="100" height="100" rx="0" fill="#dce8ff" stroke="#18a999" /><text x="845" y="323" font-size="22" fill="#18a999" font-weight="600" text-anchor="middle">02</text><rect x="908" y="265" width="100" height="100" rx="0" fill="#dce8ff" stroke="#18a999" /><text x="958" y="323" font-size="22" fill="#18a999" font-weight="600" text-anchor="middle">03</text><text x="885" y="205" font-size="22" fill="#4479ed" font-weight="600" text-anchor="middle">新画布 352 × 160</text><text x="635" y="435" font-size="20" fill="#172b4d" font-weight="600" text-anchor="start">宽度不够就扩宽；高度够用则保持不变</text><text x="635" y="468" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">灰虚框是原画布，蓝实框是新画布</text></g></svg>