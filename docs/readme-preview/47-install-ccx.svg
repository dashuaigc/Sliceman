<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><title>Creative Cloud 版 · 双击 CCX 安装</title><rect width="1200" height="420" rx="22" fill="#f3f7fc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="32" y="49" font-size="30" font-weight="700" fill="#172b4d">Creative Cloud 版 · 双击 CCX 安装</text><text x="32" y="86" font-size="19" fill="#64748b">安装流程示意，非 Creative Cloud 窗口截图。</text><rect x="32" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="62" cy="150" r="15" fill="#4479ed"/><text x="62" y="157" text-anchor="middle" font-size="19" fill="white">1</text><text x="86" y="157" font-size="23" font-weight="700" fill="#172b4d">下载安装包</text><rect x="52" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="164" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">.ccx</text><text x="52" y="289" font-size="20" fill="#53647f">在 Release 的 Assets 中</text><text x="52" y="320" font-size="20" fill="#53647f">选择 .ccx 文件</text><text x="309" y="227" text-anchor="middle" font-size="26" fill="#4479ed">→</text><rect x="326" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="356" cy="150" r="15" fill="#4479ed"/><text x="356" y="157" text-anchor="middle" font-size="19" fill="white">2</text><text x="380" y="157" font-size="23" font-weight="700" fill="#172b4d">打开安装包</text><rect x="346" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="458" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">Creative Cloud</text><text x="346" y="289" font-size="20" fill="#53647f">先安装并登录 CC 桌面端</text><text x="346" y="320" font-size="20" fill="#53647f">双击 CCX，按提示安装</text><text x="603" y="227" text-anchor="middle" font-size="26" fill="#4479ed">→</text><rect x="620" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="650" cy="150" r="15" fill="#4479ed"/><text x="650" y="157" text-anchor="middle" font-size="19" fill="white">3</text><text x="674" y="157" font-size="23" font-weight="700" fill="#172b4d">重启 Photoshop</text><rect x="640" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="752" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">重新打开 PS</text><text x="640" y="289" font-size="20" fill="#53647f">保存当前工作</text><text x="640" y="320" font-size="20" fill="#53647f">关闭并重新打开 PS</text><text x="897" y="227" text-anchor="middle" font-size="26" fill="#4479ed">→</text><rect x="914" y="117" width="264" height="267" rx="15" fill="white" stroke="#dbe5f1"/><circle cx="944" cy="150" r="15" fill="#4479ed"/><text x="944" y="157" text-anchor="middle" font-size="19" fill="white">4</text><text x="968" y="157" font-size="23" font-weight="700" fill="#172b4d">打开插件</text><rect x="934" y="184" width="224" height="70" rx="9" fill="#edf3ff"/><text x="1046" y="227" text-anchor="middle" font-size="23" font-weight="600" fill="#3269d5">Sliceman</text><text x="934" y="289" font-size="20" fill="#53647f">在插件 / 增效工具菜单中</text><text x="934" y="320" font-size="20" fill="#53647f">找到并打开 Sliceman</text></g></svg>