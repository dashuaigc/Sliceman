<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="505" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">同一张图片，四种适应结果</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">原图 1600 × 800，目标 1000 × 1000；棋盘格代表透明区域，虚线代表目标范围。</text><rect x="40" y="124" width="270" height="342" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="162" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">等比适应</text><rect x="89" y="190" width="172" height="172" rx="0" fill="url(#checker)" stroke="none" /><svg x="89" y="233" width="172" height="86" viewBox="0 0 200 100" preserveAspectRatio="none"><rect x="0" y="0" width="200" height="100" rx="0" fill="#83c8f4" stroke="none" /><circle cx="54" cy="30" r="12" fill="#ffd168"/><path d="M0 100V80L55 47L112 100Z" fill="#42b4a0"/><path d="M60 100L137 42L200 77V100Z" fill="#23866f"/></svg><text x="175" y="402" font-size="19" fill="#64748b" font-weight="400" text-anchor="middle">完整保留，空白补边</text><text x="175" y="440" font-size="22" fill="#4479ed" font-weight="650" text-anchor="middle">1000 × 1000</text><rect x="330" y="124" width="270" height="342" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="354" y="162" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">等比填充</text><rect x="379" y="190" width="172" height="172" rx="0" fill="url(#checker)" stroke="none" /><svg x="379" y="190" width="172" height="172" viewBox="0 0 172 172"><svg x="-86" y="0" width="344" height="172" viewBox="0 0 200 100" preserveAspectRatio="none"><rect x="0" y="0" width="200" height="100" rx="0" fill="#83c8f4" stroke="none" /><circle cx="54" cy="30" r="12" fill="#ffd168"/><path d="M0 100V80L55 47L112 100Z" fill="#42b4a0"/><path d="M60 100L137 42L200 77V100Z" fill="#23866f"/></svg></svg><text x="465" y="402" font-size="19" fill="#64748b" font-weight="400" text-anchor="middle">铺满目标，裁掉超出</text><text x="465" y="440" font-size="22" fill="#4479ed" font-weight="650" text-anchor="middle">1000 × 1000</text><rect x="620" y="124" width="270" height="342" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="644" y="162" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">拉伸</text><rect x="669" y="190" width="172" height="172" rx="0" fill="url(#checker)" stroke="none" /><svg x="669" y="190" width="172" height="172" viewBox="0 0 200 100" preserveAspectRatio="none"><rect x="0" y="0" width="200" height="100" rx="0" fill="#83c8f4" stroke="none" /><circle cx="54" cy="30" r="12" fill="#ffd168"/><path d="M0 100V80L55 47L112 100Z" fill="#42b4a0"/><path d="M60 100L137 42L200 77V100Z" fill="#23866f"/></svg><text x="755" y="402" font-size="19" fill="#64748b" font-weight="400" text-anchor="middle">直接拉成目标比例</text><text x="755" y="440" font-size="22" fill="#4479ed" font-weight="650" text-anchor="middle">1000 × 1000</text><rect x="910" y="124" width="270" height="342" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="934" y="162" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">仅缩放</text><svg x="959" y="233" width="172" height="86" viewBox="0 0 200 100" preserveAspectRatio="none"><rect x="0" y="0" width="200" height="100" rx="0" fill="#83c8f4" stroke="none" /><circle cx="54" cy="30" r="12" fill="#ffd168"/><path d="M0 100V80L55 47L112 100Z" fill="#42b4a0"/><path d="M60 100L137 42L200 77V100Z" fill="#23866f"/></svg><rect x="959" y="190" width="172" height="172" rx="0" fill="none" stroke="#c5d1e1" stroke-dasharray="6 5"/><text x="1045" y="402" font-size="19" fill="#64748b" font-weight="400" text-anchor="middle">保持比例，不补边</text><text x="1045" y="440" font-size="22" fill="#4479ed" font-weight="650" text-anchor="middle">1000 × 500</text></g></svg>