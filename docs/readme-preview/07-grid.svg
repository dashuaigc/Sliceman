<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="498" viewBox="0 0 1200 498" role="img" aria-labelledby="title desc">
<title id="title">定位格：一次准备好一批图标位置</title><desc id="desc">间距和排列由插件计算；创建前，面板会显示数量、排列和画布预览。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4479ed"/></marker>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#edf1f6"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#d7e0ed"/></pattern>
</defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="498" rx="22" fill="#f5f8fc" stroke="none" />
<text x="40" y="52" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">定位格：一次准备好一批图标位置</text><text x="40" y="88" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">间距和排列由插件计算；创建前，面板会显示数量、排列和画布预览。</text><rect x="40" y="122" width="340" height="294" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="64" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">输入三个值</text><text x="66" y="207" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">宽度</text><text x="205" y="207" font-size="26" fill="#4479ed" font-weight="650" text-anchor="start">100 px</text><text x="66" y="277" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">高度</text><text x="205" y="277" font-size="26" fill="#4479ed" font-weight="650" text-anchor="start">100 px</text><text x="66" y="347" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">数量</text><text x="205" y="347" font-size="26" fill="#4479ed" font-weight="650" text-anchor="start">5</text><path d="M407 273 L476 273" fill="none" stroke="#4479ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="122" width="650" height="294" rx="14" fill="#ffffff" stroke="#e0e7f0" /><text x="534" y="160" font-size="23" fill="#172b4d" font-weight="650" text-anchor="start">自动排列：3 列 × 2 行，最后一行靠左</text><rect x="570" y="192" width="92" height="82" rx="5" fill="#e6edfa" stroke="#4479ed" /><text x="616" y="239" font-size="24" fill="#4479ed" font-weight="600" text-anchor="middle">01</text><rect x="720" y="192" width="92" height="82" rx="5" fill="#e6edfa" stroke="#4479ed" /><text x="766" y="239" font-size="24" fill="#4479ed" font-weight="600" text-anchor="middle">02</text><rect x="870" y="192" width="92" height="82" rx="5" fill="#e6edfa" stroke="#4479ed" /><text x="916" y="239" font-size="24" fill="#4479ed" font-weight="600" text-anchor="middle">03</text><rect x="570" y="298" width="92" height="82" rx="5" fill="#e6edfa" stroke="#4479ed" /><text x="616" y="345" font-size="24" fill="#4479ed" font-weight="600" text-anchor="middle">04</text><rect x="720" y="298" width="92" height="82" rx="5" fill="#e6edfa" stroke="#4479ed" /><text x="766" y="345" font-size="24" fill="#4479ed" font-weight="600" text-anchor="middle">05</text><text x="40" y="459" font-size="22" fill="#64748b" font-weight="400" text-anchor="start">100 × 100 → 自动间距 13 px。每格都是独立形状图层，后续可用作图标的尺寸基准。</text></g></svg>