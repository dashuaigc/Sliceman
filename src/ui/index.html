<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="block">
      <h3>切图</h3>
      <label>项目名称</label>
      <input id="projectName" type="text" placeholder="可留空" />
      <sp-checkbox id="includeHidden">包含隐藏图层</sp-checkbox>
      <sp-checkbox id="fullBleed" checked>完整切出超出画布部分</sp-checkbox>
      <button id="sliceBtn">开始切图</button>
      <button id="stopBtn" disabled>停止切图</button>
    </section>

    <!-- ESC 暂停后确认（内联，替代 UXP 下不可靠的 <dialog>） -->
    <section id="stopConfirm" class="block" style="display:none;">
      <p style="margin:4px 0;">已暂停。是否终止任务？<br><small>终止将把 PSD 恢复到切图前</small></p>
      <button id="stopConfirmYes">终止并恢复</button>
      <button id="stopConfirmNo">继续切图</button>
    </section>

    <section class="block">
      <h3>批量前缀重命名</h3>
      <label>前缀（输入即预览，对选中的组/图层生效）</label>
      <input id="prefix" type="text" placeholder="如 图标" />
      <div id="previewList" class="preview"></div>
      <button id="renameBtn">应用前缀</button>
    </section>

    <p id="status" class="status"></p>

    <script src="panel.js"></script>
  </body>
</html>
