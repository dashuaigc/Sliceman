<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="grid four">
  <defs>
    <radialGradient id="dotGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#6F8190"/>
      <stop offset="1" stop-color="#2C3B49"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="tinyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#tinyShadow)">
    <circle cx="47" cy="47" r="15" fill="url(#dotGrad)" stroke="#AFC8DA" stroke-width="2"/>
    <circle cx="82" cy="47" r="15" fill="url(#dotGrad)" stroke="#AFC8DA" stroke-width="2"/>
    <circle cx="47" cy="82" r="15" fill="url(#dotGrad)" stroke="#AFC8DA" stroke-width="2"/>
    <circle cx="82" cy="82" r="15" fill="url(#dotGrad)" stroke="#AFC8DA" stroke-width="2"/>
  </g>
</svg>
