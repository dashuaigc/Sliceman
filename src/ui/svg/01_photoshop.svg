<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="photoshop">
  <defs>
    <linearGradient id="psBg" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#051B34"/>
      <stop offset="1" stop-color="#010914"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="42" y1="38" x2="87" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38F6FF"/>
      <stop offset="1" stop-color="#098DFF"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="tinyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="96" height="96" rx="18" fill="url(#psBg)" stroke="#00BBFF" stroke-width="2.5" filter="url(#softShadow)"/>
  <rect x="20" y="20" width="88" height="88" rx="15" fill="none" stroke="#06182D" stroke-width="3" opacity="0.45"/>
  <text x="64" y="75" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="43" font-weight="900" fill="url(#cyanText)" letter-spacing="-2">PS</text>
</svg>
