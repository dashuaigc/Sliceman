<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="more">
  <defs>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="tinyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g fill="#FFFFFF" filter="url(#tinyShadow)">
    <circle cx="40" cy="64" r="7"/>
    <circle cx="64" cy="64" r="7"/>
    <circle cx="88" cy="64" r="7"/>
  </g>
</svg>
